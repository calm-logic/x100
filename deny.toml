# Licences the workspace may depend on, checked by `cargo deny check licenses bans --config
# crates/x100-app/deny.toml` (the CI's `licences` job). It lives with the app because GPUI is what
# brings in a large graph: Zed's own `terminal`, `terminal_view`, `markdown`, `ui` and `theme`
# crates are GPL-3.0-or-later, and neither they nor any other GPL-only crate may be depended on.

[graph]
all-features = false

[licenses]
confidence-threshold = 0.9
# An expression with OR passes when any one licence is allowed, so dual-licensed crates such as
# `self_cell` (Apache-2.0 OR GPL-2.0-only) pass on the permissive side.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "allow"
deny = [
    { name = "terminal", reason = "Zed's terminal is GPL; the app has its own view on alacritty_terminal" },
    { name = "terminal_view", reason = "GPL" },
    { name = "markdown", reason = "Zed's markdown is GPL; the app has its own view on pulldown-cmark" },
    { name = "ui", reason = "GPL" },
    { name = "theme", reason = "GPL" },
]
