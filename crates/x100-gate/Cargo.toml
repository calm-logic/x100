[package]
name = "x100-gate"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
x100-core = { path = "../x100-core" }
# Quotes the agent's own text in the classifier's question, and builds and reads each decision
# model's JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
x100-core = { path = "../x100-core", features = ["testing"] }
proptest = "1"
