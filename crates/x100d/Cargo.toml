[package]
name = "x100d"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
name = "x100d"
path = "src/lib.rs"

[[bin]]
name = "x100d"
path = "src/main.rs"

# The fake harness as a program of this package, so its tests and a daemon started from them can
# find it without depending on another package's binary having been built.
[[bin]]
name = "x100d-fake-harness"
path = "src/bin/fake_harness.rs"

# The sandbox's helper, shipped beside `x100d`, which runs it on both sides of a sandbox's
# boundary. A program of this package so that building the daemon builds it.
[[bin]]
name = "x100d-sandbox"
path = "src/bin/sandbox.rs"

[dependencies]
x100-core = { path = "../x100-core" }
x100-store = { path = "../x100-store" }
x100-proto = { path = "../x100-proto" }
x100-drivers = { path = "../x100-drivers" }
x100-jobs = { path = "../x100-jobs" }
x100-orch = { path = "../x100-orch" }
x100-router = { path = "../x100-router" }
x100-sandbox = { path = "../x100-sandbox" }
x100-vault = { path = "../x100-vault" }
x100-integrations = { path = "../x100-integrations" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
ulid = "3"

[dev-dependencies]
x100-client = { path = "../x100-client" }
base64 = "0.22"
x100-drivers = { path = "../x100-drivers", features = ["testing"] }
x100-store = { path = "../x100-store" }
x100-core = { path = "../x100-core", features = ["testing"] }
nix = { version = "0.29", features = ["signal"] }
tempfile = "3"
# The decision models' stand-in server speaks HTTPS with a test authority, as the vault's own tests
# do; the same versions and features as `x100-vault`, so nothing new is built.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
