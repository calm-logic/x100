# Fernleaf, modelled on the demo: the builder's first message to a new project, which the CEO sets
# up from it, a BRD, three leads, workers under two of them and a
# worker with a worker of its own, a lead asking another lead, a question to the builder, a worker
# waiting on a job of its own, a daily job delegating smoke tests, and the final report.
#
# Every agent plays this one script; a turn is picked by the role in its start pack and by what its
# input says. Ids come from labelled lines, as a model would read them: `{{pack:Your id}}` and
# `{{pack:Lead Tech}}` from the start pack, `{{input:Current task}}`, `{{input:Task}}`,
# `{{input:Report on}}` and `{{input:Message}}` from the turn's input. A value saved from a call
# lasts only as long as the driver that made it, so a turn after the clock moves uses lookups.
# Times are on a fake clock that starts at 1794387600000. The orchestrator's test runs this script
# in its own process; the daemon's test runs it through the daemon.

[harness]
name = "fake-fernleaf"

[[model]]
model = "fake-long"
context_window = 200000
cache_lifetime_secs = 604800
efforts = ["low", "medium", "high", "max"]
price = { input = 3.0, output = 15.0, cache_read = 0.3 }

[[model]]
model = "fake-brief"
context_window = 200000
cache_lifetime_secs = 300
efforts = ["low", "medium", "high", "max"]
price = { input = 1.0, output = 5.0, cache_read = 0.1 }

# The project is new: the CEO, on a driver in the scratch directory, sets it up from the builder's
# first message, which opens its task. Its next turn is on a new driver in the code directory.
[[turn]]
when = { start_pack_contains = "PROJECT: not set up yet", input_contains = "Launch Fernleaf" }
steps = [
  { text = "Fernleaf it is: a waitlist page for a plant shop. Setting it up now." },
  { call = { set_up_project = { name = "Fernleaf", intent = "A waitlist page for Fernleaf, a plant shop.", brief = "Launch Fernleaf\nA landing page for Fernleaf, a plant shop, with a waitlist." } } },
  { usage = { input = 900, output = 120, cost_micros = 9000 } },
]

# Anything else said before the project is set up tells the CEO nothing yet, so it only answers.
[[turn]]
when = { start_pack_contains = "PROJECT: not set up yet" }
repeat = true
steps = [{ text = "Hello! What would you like to build?" }]

# The CEO answers, writes the BRD, forms the team, delegates to two leads and asks the builder.
[[turn]]
when = { start_pack_contains = "ROLE: CEO\n", input_contains = "Launch Fernleaf" }
steps = [
  { text = "On it: the BRD first, then a team." },
  { call = { write_spec = { spec = "brd", status = "draft", body = "# BRD\nA waitlist page for Fernleaf, a plant shop." } } },
  { call = { form_team = { leads = [
      { role = "Tech", charter = "Tech for Fernleaf.", effort = { min = "medium", max = "max" }, budget = 15000000 },
      { role = "Product", charter = "Product for Fernleaf.", effort = { min = "low", max = "high" }, budget = 8000000 },
      { role = "Marketing", charter = "Marketing for Fernleaf.", effort = { min = "low", max = "medium" }, budget = 5000000 },
    ] } }, save = "team" },
  { call = { delegate = { to = { child = "{{team.Tech}}" }, task = { new = { title = "Build the site", ask = "An Astro site with a waitlist.", attachments = [] } }, effort = "medium" } }, save = "site" },
  { call = { delegate = { to = { child = "{{team.Product}}" }, task = { new = { title = "Write the PRD", ask = "From the BRD.", attachments = [] } }, effort = "low" } }, save = "prd" },
  { call = { message = { to = "builder", body = "Forest greens or ocean blues?", attachments = [] } }, save = "question" },
  { call = { wait = { on = { reply = { message = "{{question.message}}", from = "builder" } }, task = "{{input:Current task}}", progress = { note = "BRD drafted, team formed. Waiting on the palette.", done = 15 } } } },
  { usage = { input = 4200, output = 900, cost_micros = 42000 } },
]

# Tech sets the architecture and starts two workers, then waits on the landing page.
[[turn]]
when = { start_pack_contains = "ROLE: Tech\n", input_contains = "Build the site" }
steps = [
  { call = { write_spec = { spec = "add", status = "draft", body = "# ADD\nAstro, Tailwind, Workers." } } },
  { call = { delegate = { to = { new_worker = { role = "Backend", charter = "Backend for the site." } }, task = { new = { title = "Build the API", ask = "The waitlist API.", attachments = [] } }, effort = "medium" } }, save = "api" },
  { call = { delegate = { to = { new_worker = { role = "Frontend", charter = "Frontend for the site." } }, task = { new = { title = "Build the landing page", ask = "From the sketch.", attachments = [] } }, effort = "high" } }, save = "landing" },
  { call = { wait = { on = { report = "{{landing.task}}" }, task = "{{input:Current task}}", progress = { note = "API and landing page delegated.", done = 10 } } } },
  { usage = { input = 3100, output = 700, cost_micros = 31000 } },
]

# Product starts Research and asks Tech directly. Delegating to another lead is refused first.
[[turn]]
when = { start_pack_contains = "ROLE: Product\n", input_contains = "Write the PRD" }
steps = [
  { call = { delegate = { to = { child = "{{pack:Lead Tech}}" }, task = { new = { title = "Pick the stack", ask = "For the PRD.", attachments = [] } }, effort = "low" } } },
  { call = { delegate = { to = { new_worker = { role = "Research", charter = "Research for the PRD." } }, task = { new = { title = "Research competitors", ask = "Three plant shops.", attachments = [] } }, effort = "low" } }, save = "competitors" },
  { call = { message = { to = { agent = "{{pack:Lead Tech}}" }, body = "Which framework is the site on?", attachments = [] } }, save = "question" },
  { call = { wait = { on = { reply = { message = "{{question.message}}", from = { agent = "{{pack:Lead Tech}}" } } }, task = "{{input:Current task}}", progress = { note = "Outline done; waiting on Tech for the stack.", done = 20 } } } },
  { usage = { input = 1200, output = 300, cost_micros = 12000 } },
]

# Backend writes routes and starts a worker of its own.
[[turn]]
when = { start_pack_contains = "ROLE: Backend\n", input_contains = "Build the API" }
steps = [
  { write = "api/waitlist.ts", content = "export const waitlist: string[] = [];\n" },
  { call = { delegate = { to = { new_worker = { role = "Migrations", charter = "Schema migrations." } }, task = { new = { title = "Write the schema migrations", ask = "The waitlist table.", attachments = [] } }, effort = "medium" } }, save = "schema" },
  { call = { wait = { on = { report = "{{schema.task}}" }, task = "{{input:Current task}}", progress = { note = "Routes sketched; schema delegated.", done = 30 } } } },
  { usage = { input = 1500, output = 400, cost_micros = 15000 } },
]

# Frontend builds the page, raises an idea, and reports.
[[turn]]
when = { start_pack_contains = "ROLE: Frontend\n", input_contains = "Build the landing page" }
steps = [
  { write = "site/index.html", content = "<h1>Fernleaf</h1>\n" },
  { call = { raise_task = { title = "Check the mobile layout", ask = "The grid breaks under 400px.", attachments = [] } }, save = "idea" },
  { call = { report = { task = "{{input:Task}}", outcome = "completed", summary = "Landing page built.\nRaised: {{idea.task}}" } } },
  { usage = { input = 2000, output = 600, cost_micros = 20000 } },
]

# Research schedules a look at the pricing pages in an hour, and waits for it.
[[turn]]
when = { start_pack_contains = "ROLE: Research\n", input_contains = "Research competitors" }
steps = [
  { call = { schedule = { when = { once = { at = 1794391200000 } }, does = { wake = { agent = "{{pack:Your id}}", note = "Pricing pages update at noon; look again." } } } }, save = "recheck" },
  { call = { wait = { on = { job = "{{recheck.job}}" }, task = "{{input:Current task}}", progress = { note = "Three found; pricing to recheck.", done = 70 } } } },
  { usage = { input = 900, output = 200, cost_micros = 4000 } },
]

# Tech answers Product, accepts the landing page, gives Frontend the raised idea, and waits on the
# API.
[[turn]]
when = { start_pack_contains = "ROLE: Tech\n", input_contains = "Which framework is the site on?" }
steps = [
  { call = { message = { to = { agent = "{{pack:Lead Product}}" }, body = "Astro with Tailwind.", attachments = [], in_reply_to = "{{input:Message}}" } } },
  { call = { review = { task = "{{input:Report on}}", verdict = "accept" } } },
  { call = { delegate = { to = { child = "{{landing.agent}}" }, task = { raised = "{{input:Raised}}" }, effort = "medium" } }, save = "mobile" },
  { call = { wait = { on = { report = "{{api.task}}" }, task = "{{input:Current task}}", progress = { note = "Landing page in; waiting on the API.", done = 50 } } } },
  { usage = { input = 1800, output = 400, cost_micros = 18000 } },
]

# Product has its answer, drafts the PRD, and waits on Research.
[[turn]]
when = { start_pack_contains = "ROLE: Product\n", input_contains = "Astro with Tailwind." }
steps = [
  { call = { write_spec = { spec = "prd", status = "draft", body = "# PRD\nWaitlist, plant grid." } } },
  { call = { wait = { on = { report = "{{competitors.task}}" }, task = "{{input:Current task}}", progress = { note = "PRD drafted; waiting on research.", done = 50 } } } },
  { usage = { input = 1100, output = 300, cost_micros = 9000 } },
]

[[turn]]
when = { start_pack_contains = "ROLE: Migrations\n", input_contains = "Write the schema migrations" }
steps = [
  { write = "migrations/0001.sql", content = "create table waitlist (email text primary key);\n" },
  { call = { report = { task = "{{input:Task}}", outcome = "completed", summary = "One table, one key." } } },
  { usage = { input = 700, output = 200, cost_micros = 3000 } },
]

[[turn]]
when = { start_pack_contains = "ROLE: Frontend\n", input_contains = "Check the mobile layout" }
steps = [
  { write = "site/mobile.css", content = "@media (max-width: 400px) { .grid { display: block; } }\n" },
  { call = { report = { task = "{{input:Task}}", outcome = "completed", summary = "Mobile layout fixed." } } },
  { usage = { input = 800, output = 200, cost_micros = 6000 } },
]

[[turn]]
when = { start_pack_contains = "ROLE: Backend\n", input_contains = "One table, one key." }
steps = [
  { call = { review = { task = "{{input:Report on}}", verdict = "accept" } } },
  { call = { report = { task = "{{input:Current task}}", outcome = "completed", summary = "The API is built." } } },
  { usage = { input = 900, output = 200, cost_micros = 7000 } },
]

# Tech accepts both of its workers' reports and reports the site.
[[turn]]
when = { start_pack_contains = "ROLE: Tech\n", input_contains = "The API is built." }
steps = [
  { call = { review = { task = "{{mobile.task}}", verdict = "accept" } } },
  { call = { review = { task = "{{api.task}}", verdict = "accept" } } },
  { call = { report = { task = "{{input:Current task}}", outcome = "completed", summary = "The site is built." } } },
  { usage = { input = 1600, output = 300, cost_micros = 16000 } },
]

# The CEO accepts the site while its question to the builder is still open.
[[turn]]
when = { start_pack_contains = "ROLE: CEO\n", input_contains = "The site is built." }
steps = [
  { call = { review = { task = "{{input:Report on}}", verdict = "accept" } } },
  { usage = { input = 1000, output = 100, cost_micros = 10000 } },
]

# The builder's answer: the BRD is approved, Marketing gets its first work, smoke tests go daily.
[[turn]]
when = { start_pack_contains = "ROLE: CEO\n", input_contains = "Forest greens." }
steps = [
  { call = { write_spec = { spec = "brd", status = "approved", body = "# BRD\nForest greens." } } },
  { call = { delegate = { to = { child = "{{team.Marketing}}" }, task = { new = { title = "Write the launch copy", ask = "Short and warm.", attachments = [] } }, effort = "low" } }, save = "copy" },
  { call = { schedule = { when = { every = { first = 1794394800000, every = { secs = 86400, nanos = 0 } } }, does = { delegate = { to = "{{team.Tech}}", title = "Run the smoke tests", ask = "Every morning.", effort = "low" } } } }, save = "smoke" },
  { call = { wait = { on = { report = "{{copy.task}}" }, task = "{{input:Current task}}", progress = { note = "BRD approved; smoke tests daily.", done = 40 } } } },
  { usage = { input = 2000, output = 400, cost_micros = 20000 } },
]

[[turn]]
when = { start_pack_contains = "ROLE: Marketing\n", input_contains = "Write the launch copy" }
steps = [
  { write = "copy/launch.md", content = "Grow something.\n" },
  { call = { report = { task = "{{input:Task}}", outcome = "completed", summary = "Launch copy written." } } },
  { usage = { input = 600, output = 300, cost_micros = 2000 } },
]

[[turn]]
when = { start_pack_contains = "ROLE: CEO\n", input_contains = "Launch copy written." }
steps = [
  { call = { review = { task = "{{input:Report on}}", verdict = "accept" } } },
  { call = { wait = { on = { report = "{{prd.task}}" }, task = "{{input:Current task}}", progress = { note = "Copy in; waiting on the PRD.", done = 60 } } } },
  { usage = { input = 900, output = 150, cost_micros = 9000 } },
]

# Research's driver retired during its hour-long wait. The job wakes it on a new driver, which
# knows where the work stood only from its start pack.
[[turn]]
when = { start_pack_contains = "Progress note (70% done): Three found; pricing to recheck.", input_contains = "Pricing pages update at noon" }
steps = [
  { call = { report = { task = "{{input:Current task}}", outcome = "completed", summary = "Two of three price per seat." } } },
  { usage = { input = 700, output = 150, cost_micros = 3000 } },
]

[[turn]]
when = { start_pack_contains = "ROLE: Product\n", input_contains = "Two of three price per seat." }
steps = [
  { call = { review = { task = "{{input:Report on}}", verdict = "accept" } } },
  { call = { write_spec = { spec = "prd", status = "approved", body = "# PRD\nApproved." } } },
  { call = { report = { task = "{{input:Current task}}", outcome = "completed", summary = "PRD approved." } } },
  { usage = { input = 1000, output = 250, cost_micros = 8000 } },
]

# The final report, which merges the CEO's branch into the project's main branch.
[[turn]]
when = { start_pack_contains = "ROLE: CEO\n", input_contains = "PRD approved." }
steps = [
  { call = { review = { task = "{{input:Report on}}", verdict = "accept" } } },
  { call = { report = { task = "{{input:Current task}}", outcome = "completed", summary = "Fernleaf is ready: the site, the copy and the PRD are in." } } },
  { usage = { input = 1200, output = 200, cost_micros = 12000 } },
]

# Each morning's smoke tests, a fresh task each time.
[[turn]]
when = { start_pack_contains = "ROLE: Tech\n", input_contains = "Run the smoke tests" }
repeat = true
steps = [
  { call = { report = { task = "{{input:Task}}", outcome = "completed", summary = "Smoke tests pass." } } },
  { usage = { input = 500, output = 100, cost_micros = 2000 } },
]

[[turn]]
when = { start_pack_contains = "ROLE: CEO\n", input_contains = "Smoke tests pass." }
repeat = true
steps = [
  { call = { review = { task = "{{input:Report on}}", verdict = "accept" } } },
  { usage = { input = 500, output = 50, cost_micros = 1000 } },
]
