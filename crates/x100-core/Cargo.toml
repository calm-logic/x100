[package]
name = "x100-core"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# The log builder and the scenario logs that this crate's tests and later crates' tests replay.
testing = []

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
ulid = { version = "3", default-features = false }

[dev-dependencies]
x100-core = { path = ".", features = ["testing"] }
proptest = "1"
serde_json = "1"
stateright = "0.31.0"
