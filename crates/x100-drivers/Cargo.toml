[package]
name = "x100-drivers"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# The fake provider: a local HTTP server that speaks enough of the Anthropic Messages API and the
# OpenAI Responses API to drive the real harnesses without a paid model.
testing = []

[[bin]]
name = "x100-fake-harness"
path = "src/bin/x100-fake-harness.rs"

[dependencies]
x100-core = { path = "../x100-core" }
alacritty_terminal = "0.26"
async-trait = "0.1"
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
nix = { version = "0.29", features = ["signal", "process"] }
pty-process = { version = "0.5", features = ["async"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
toml = "0.8"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
x100-drivers = { path = ".", features = ["testing"] }
tempfile = "3"
