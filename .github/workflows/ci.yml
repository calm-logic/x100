name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # What GPUI links or builds against on Linux: xkbcommon with its X11 part, xcb, Wayland and
      # fontconfig. Vulkan and GL are loaded at run time; the tests draw on GPUI's test platform
      # and need no display.
      - name: Install GPUI's system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libx11-xcb-dev libwayland-dev libfontconfig-dev libvulkan1 bubblewrap
          # Ubuntu's AppArmor stops an ordinary user making user namespaces, which bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          echo "X100_REQUIRE_SANDBOX=1" >> "$GITHUB_ENV"
      # rustup reads rust-toolchain.toml and installs the pinned channel and components.
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo fmt --check

  licences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans
